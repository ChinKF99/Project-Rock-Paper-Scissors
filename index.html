<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">
        <button id="r">rock</button>
        <button id="p">paper</button>
        <button id="s">scissors</button>
    </div>
    <script>

        //Assign rock, paper, scissors to a Global variable
        let r = 'rock'
        let p = 'paper'
        let s = 'scissors'

        //Gather the variable and put in into an array
        let choices = [r,p,s]

        let computerScore = 0
        let humanScore = 0

   
        
        function getComputerChoice(){
            //Use random methods to pick a variable
            randomChoice = Math.floor(Math.random()* choices.length)
            return choices[randomChoice]
        }

        //Function for playRound 
        function playRound(humanChoice,computerChoice){
            //Write conditional statements for winning, tie, losing
            if (humanChoice === computerChoice ){
                const result = document.createElement("div")
                result.textContent = "It's a TIE! no score for both!!"
                container.appendChild(result)
            }
            else if (humanChoice === r && computerChoice === s){
                const result = document.createElement("div")
                result.textContent = "You WIN! +1 score!"
                container.appendChild(result)
                humanScore +=1
            }
            else if (humanChoice === p && computerChoice === r){
                const result = document.createElement("div")
                result.textContent = "You WIN! +1 score!"
                container.appendChild(result)
                humanScore +=1
            }
            else if (humanChoice === s && computerChoice === p){
                const result = document.createElement("div")
                result.textContent = "You WIN! +1 score!"
                container.appendChild(result)
                humanScore +=1
            }
            else{
                const result = document.createElement("div")
                result.textContent = "You LOSE! Computer +1 score"
                container.appendChild(result)
                computerScore +=1
            }
            return humanScore
            return computerScore
        }
    
        const rock = document.querySelector("#r")
        const paper = document.querySelector("#p")
        const scissors = document.querySelector("#s")
        const container = document.querySelector("#container")


        function showWinner(cScore, hScore){
            if(cScore === 5){
                showFinalResult = document.createElement("p")
                showFinalResult.textContent = "Computer wins!"
                container.appendChild(showFinalResult)
                computerScore = 0
                humanScore = 0
            }
            else if(hScore ===5){
                showFinalResult = document.createElement("p")
                showFinalResult.textContent = "Human wins!"
                container.appendChild(showFinalResult)
                computerScore = 0
                humanScore = 0
            }
        }
        
        rock.addEventListener("click", ()=>{
            playRound("rock",getComputerChoice())
            console.log(humanScore)
            console.log(computerScore)
            showWinner(computerScore,humanScore)
        })

        paper.addEventListener("click", ()=>{
            playRound("paper",getComputerChoice())
            console.log(humanScore)
            console.log(computerScore)
            showWinner(computerScore,humanScore)
        })

        scissors.addEventListener("click",()=>{
            playRound("scissors",getComputerChoice())
            console.log(humanScore)
            console.log(computerScore)
            showWinner(computerScore,humanScore)

        })

    </script>
</body>
</html>
